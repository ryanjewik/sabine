server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 🔧 This rule only falls back when the file does NOT exist
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: add correct MIME types (optional, but safe)
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
}
